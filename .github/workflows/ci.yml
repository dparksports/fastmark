name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Generate synthetic 25 MB document
        shell: bash
        run: ./target/release/fastmark.exe --bench-gen 25600 > bench-25mb.md
      - name: Bench 25 MB document
        shell: bash
        run: ./target/release/fastmark.exe --bench bench-25mb.md
      - name: Bench demo document
        shell: bash
        run: ./target/release/fastmark.exe --bench samples/demo.md
      - uses: actions/upload-artifact@v4
        with:
          name: fastmark-windows-x64
          path: |
            target/release/fastmark.exe
            samples/demo.md

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fastmark-ffi
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build dotnet/Fastmark.App/Fastmark.App.csproj -c Release
      - run: dotnet publish dotnet/Fastmark.App/Fastmark.App.csproj -c Release -o dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: fastmark-native-windows-x64
          path: dist-native/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, bench, native]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package classic
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/fastmark.exe dist/
          cp -r samples dist/
          cp README.md LICENSE dist/
          cd dist && 7z a ../fastmark-windows-x64.zip . && cd ..
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: cargo build --release -p fastmark-ffi
      - name: Package native (self-contained WinUI 3)
        shell: bash
        run: |
          dotnet publish dotnet/Fastmark.App/Fastmark.App.csproj -c Release -o dist-native
          cd dist-native && 7z a ../fastmark-native-windows-x64.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fastmark-windows-x64.zip
            fastmark-native-windows-x64.zip
