name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Generate synthetic 100 MB document
        shell: bash
        run: ./target/release/mdview.exe --bench-gen 102400 > bench-100mb.md
      - name: Bench 100 MB document
        shell: bash
        run: ./target/release/mdview.exe --bench bench-100mb.md
      - name: Bench demo document
        shell: bash
        run: ./target/release/mdview.exe --bench samples/demo.md
      - uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-x64
          path: |
            target/release/mdview.exe
            samples/demo.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, bench]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mdview.exe dist/
          cp -r samples dist/
          cp README.md LICENSE dist/
          cd dist && 7z a ../mdview-windows-x64.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: mdview-windows-x64.zip
