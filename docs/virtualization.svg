<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#141d33"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#26324e" stroke-width="3"/>
    </pattern>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/>
    </marker>
    <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="600" fill="#0b1220"/>
  <text x="56" y="52" fill="#e2e8f0" font-size="26" font-weight="700">Virtualized layout — render only what the eye sees</text>
  <text x="56" y="76" fill="#94a3b8" font-size="14">A 100 MB document has ~100k blocks. mdview shapes a screenful; everything else is a cheap height estimate until you scroll there.</text>
  <rect x="56" y="90" width="1008" height="4" rx="2" fill="url(#hdr3)"/>

  <!-- Document column -->
  <g>
    <text x="110" y="130" fill="#e2e8f0" font-size="14" font-weight="700">document (all blocks)</text>
    <rect x="110" y="142" width="230" height="400" rx="10" fill="url(#hatch)" stroke="#24304d"/>
    <!-- estimated blocks -->
    <g fill="#64748b" font-size="10.5" text-anchor="middle">
      <text x="225" y="166">estimated height ·······</text>
      <text x="225" y="184">estimated height ·······</text>
      <text x="225" y="202">estimated height ·······</text>
      <text x="225" y="466">estimated height ·······</text>
      <text x="225" y="484">estimated height ·······</text>
      <text x="225" y="502">estimated height ·······</text>
    </g>

    <!-- viewport window -->
    <rect x="98" y="222" width="254" height="222" rx="12" fill="#0e1a2f" stroke="#818cf8" stroke-width="2.5"/>
    <!-- measured blocks inside -->
    <g>
      <rect x="112" y="234" width="206" height="24" rx="5" fill="#14532d" stroke="#34d399"/>
      <rect x="112" y="264" width="206" height="16" rx="5" fill="#14532d" stroke="#34d399"/>
      <rect x="112" y="286" width="206" height="40" rx="5" fill="#14532d" stroke="#34d399"/>
      <rect x="112" y="332" width="206" height="24" rx="5" fill="#14532d" stroke="#34d399"/>
      <rect x="112" y="362" width="206" height="30" rx="5" fill="#14532d" stroke="#34d399"/>
      <rect x="112" y="398" width="206" height="16" rx="5" fill="#14532d" stroke="#34d399"/>
      <!-- overscan zone -->
      <rect x="112" y="420" width="206" height="16" rx="5" fill="#3f2d12" stroke="#fbbf24" stroke-dasharray="4 3"/>
    </g>
    <text x="225" y="216" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">viewport + overscan</text>
    <text x="366" y="436" fill="#fcd34d" font-size="11">prefetch margin</text>

    <!-- legend -->
    <rect x="366" y="234" width="14" height="14" rx="3" fill="#14532d" stroke="#34d399"/>
    <text x="388" y="246" fill="#cbd5e1" font-size="12">measured (shaped, cached in LRU)</text>
    <rect x="366" y="258" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#24304d"/>
    <text x="388" y="270" fill="#cbd5e1" font-size="12">estimated (arithmetic only)</text>
  </g>

  <!-- Right: how it works -->
  <g>
    <text x="640" y="130" fill="#e2e8f0" font-size="14" font-weight="700">the machinery</text>

    <rect x="640" y="146" width="424" height="88" rx="10" fill="#111a2e" stroke="#24304d"/>
    <text x="656" y="172" fill="#a5b4fc" font-size="13" font-weight="700">1 · position index</text>
    <text x="656" y="192" fill="#cbd5e1" font-size="11.5">every block starts with an estimated height (chars ÷</text>
    <text x="656" y="208" fill="#cbd5e1" font-size="11.5">chars-per-line, min lines); prefix sums give a binary-</text>
    <text x="656" y="224" fill="#cbd5e1" font-size="11.5">searched "which blocks intersect this scroll offset"</text>

    <rect x="640" y="246" width="424" height="88" rx="10" fill="#111a2e" stroke="#24304d"/>
    <text x="656" y="272" fill="#6ee7b7" font-size="13" font-weight="700">2 · measure on arrival</text>
    <text x="656" y="292" fill="#cbd5e1" font-size="11.5">blocks entering the viewport get truly shaped once;</text>
    <text x="656" y="308" fill="#cbd5e1" font-size="11.5">the measured height replaces the estimate and the</text>
    <text x="656" y="324" fill="#cbd5e1" font-size="11.5">scrollbar converges as you scroll (no jumps when done)</text>

    <rect x="640" y="346" width="424" height="88" rx="10" fill="#111a2e" stroke="#24304d"/>
    <text x="656" y="372" fill="#fcd34d" font-size="13" font-weight="700">3 · bounded caches</text>
    <text x="656" y="392" fill="#cbd5e1" font-size="11.5">shaped buffers: LRU of 128 blocks · glyph atlas ·</text>
    <text x="656" y="408" fill="#cbd5e1" font-size="11.5">decoded images: LRU ≤ 128 MB · resize/zoom/DPI</text>
    <text x="656" y="424" fill="#cbd5e1" font-size="11.5">change invalidates with one cache clear</text>

    <rect x="640" y="446" width="424" height="72" rx="10" fill="#111a2e" stroke="#24304d"/>
    <text x="656" y="470" fill="#e2e8f0" font-size="13" font-weight="700">scroll cost, wherever you are</text>
    <text x="656" y="490" fill="#94a3b8" font-size="11.5">shape a screenful of blocks · reuse the rest from cache</text>
    <text x="656" y="506" fill="#94a3b8" font-size="11.5">≈ the same work at byte 0 or byte 900,000,000</text>
  </g>

  <text x="56" y="566" fill="#64748b" font-size="11.5">The one trade-off: jumping deep into unmeasured territory lands on an estimate first and settles as blocks get measured (see README, "Known limitations").</text>
</svg>
