<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif">
  <!-- Apple HIG-style: white ground, generous space, big radii, one accent -->

  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">Three panes. One native window.</text>
  <text x="80" y="132" font-size="19" fill="#6e6e73">Files on the left, the document center stage, the outline on the right — resizable, collapsible, remembered.</text>

  <!-- Window mock -->
  <g>
    <rect x="80" y="176" width="1040" height="360" rx="24" fill="#f5f5f7"/>
    <rect x="96" y="192" width="1008" height="328" rx="16" fill="#ffffff"/>
    <!-- subtle window title strip -->
    <rect x="96" y="192" width="1008" height="36" rx="16" fill="#f5f5f7"/>
    <rect x="96" y="212" width="1008" height="16" fill="#f5f5f7"/>
    <circle cx="120" cy="210" r="5" fill="#e8e8ed"/><circle cx="138" cy="210" r="5" fill="#e8e8ed"/><circle cx="156" cy="210" r="5" fill="#e8e8ed"/>
    <text x="600" y="215" font-size="12" fill="#6e6e73" text-anchor="middle">demo.md — fastmark</text>

    <!-- FILES panel -->
    <rect x="112" y="240" width="230" height="264" rx="12" fill="#f5f5f7"/>
    <text x="128" y="264" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="0.8">FILES</text>
    <rect x="126" y="278" width="202" height="22" rx="6" fill="#0071e3" opacity="0.12"/>
    <rect x="126" y="278" width="3" height="22" rx="1.5" fill="#0071e3"/>
    <text x="140" y="293" font-size="12" fill="#1d1d1f">samples</text>
    <text x="148" y="320" font-size="12" fill="#6e6e73">demo.md</text>
    <text x="148" y="342" font-size="12" fill="#6e6e73">bench.md</text>
    <text x="148" y="364" font-size="12" fill="#6e6e73">release-notes.md</text>
    <text x="128" y="420" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="0.8">OPEN FOLDER</text>
    <rect x="126" y="432" width="130" height="26" rx="13" fill="#0071e3"/>
    <text x="191" y="449" font-size="11" fill="#ffffff" text-anchor="middle">Choose…</text>

    <!-- splitter L -->
    <rect x="352" y="240" width="8" height="264" rx="4" fill="#e8e8ed"/>

    <!-- content -->
    <text x="392" y="272" font-size="17" font-weight="700" fill="#1d1d1f">fastmark demo</text>
    <rect x="392" y="286" width="330" height="4" rx="2" fill="#e8e8ed"/>
    <rect x="392" y="302" width="380" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>
    <rect x="392" y="318" width="360" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>
    <rect x="392" y="334" width="120" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>
    <rect x="386" y="352" width="404" height="52" rx="10" fill="#f5f5f7"/>
    <text x="400" y="376" font-size="11" fill="#6e6e73" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">fn main() {</text>
    <text x="400" y="392" font-size="11" fill="#6e6e73" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">  fastmark::open(path)</text>
    <text x="392" y="432" font-size="12" font-weight="600" fill="#1d1d1f">A section heading</text>
    <rect x="392" y="442" width="300" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>
    <rect x="392" y="458" width="370" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>
    <rect x="392" y="474" width="200" height="4" rx="2" fill="#e8e8ed" opacity="0.7"/>

    <!-- splitter R -->
    <rect x="804" y="240" width="8" height="264" rx="4" fill="#e8e8ed"/>

    <!-- OUTLINE panel -->
    <rect x="826" y="240" width="264" height="264" rx="12" fill="#f5f5f7"/>
    <text x="842" y="264" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="0.8">OUTLINE</text>
    <rect x="840" y="278" width="236" height="22" rx="6" fill="#0071e3" opacity="0.12"/>
    <rect x="840" y="278" width="3" height="22" rx="1.5" fill="#0071e3"/>
    <text x="854" y="293" font-size="12" fill="#1d1d1f">fastmark demo</text>
    <text x="866" y="320" font-size="12" fill="#6e6e73">Text</text>
    <text x="866" y="342" font-size="12" fill="#6e6e73">Code</text>
    <text x="866" y="364" font-size="12" fill="#6e6e73">Lists</text>
    <text x="854" y="386" font-size="12" fill="#1d1d1f">Tables</text>
  </g>

  <!-- callout chips -->
  <g font-size="14" fill="#1d1d1f">
    <rect x="80" y="572" width="250" height="44" rx="22" fill="#f5f5f7"/>
    <text x="205" y="599" text-anchor="middle" font-weight="600">Drag to resize</text>
    <rect x="354" y="572" width="250" height="44" rx="22" fill="#f5f5f7"/>
    <text x="479" y="599" text-anchor="middle" font-weight="600">Collapse any panel</text>
    <rect x="628" y="572" width="250" height="44" rx="22" fill="#f5f5f7"/>
    <text x="753" y="599" text-anchor="middle" font-weight="600">Double-click to reset</text>
    <rect x="902" y="572" width="218" height="44" rx="22" fill="#0071e3"/>
    <text x="1011" y="599" text-anchor="middle" font-weight="600" fill="#ffffff">Layout remembered</text>
  </g>
</svg>
