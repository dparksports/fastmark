[workspace]
resolver = "2"
members = ["crates/mdview-core", "crates/mdview-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dparksports/mdview"
rust-version = "1.82"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
