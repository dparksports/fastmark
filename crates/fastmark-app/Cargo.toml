[package]
name = "fastmark-app"
description = "fastmark - a fast, memory-efficient native Markdown viewer (Windows-first, cross-platform core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "fastmark"

[[bin]]
name = "fastmark"
path = "src/main.rs"

[dependencies]
fastmark-core = { path = "../fastmark-core" }
winit = "0.30"
wgpu = "25"
glyphon = "0.9"
cosmic-text = "0.14"
pollster = "0.4"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Foundation"] }
winreg = "0.52"
